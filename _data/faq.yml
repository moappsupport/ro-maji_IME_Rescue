# トップページの「よくある質問」の原本。docs/index.md が、本文（details）と構造化データ（FAQPage）の
# 両方をここから作る。同じ文を2か所に手で書くと片方だけ直してずれるため。
#
# a は HTML として出力する。構造化データにはタグを外した文が入る。
# {price}・{trial}・{base} は index.md で _config.yml の price_jpy・trial_days・baseurl に置き換える
# （データファイルの中では Liquid が展開されないため）。
# 値は一重引用符で囲む（: や { を含んでも YAML として壊れないように）。

- q: '英語配列のキーボードでも使えますか'
  a: '使えます。設定画面で起動用のキーを「右Ctrl キー」に変更してください。単独で短く押したときだけ働き、Ctrl+C などキーとの組み合わせでは働きません。Ctrl+クリックや Ctrl+ホイールは押している時間の長さで見分けるため、ごく短い操作では働くことがあります。'

- q: '無料で試せますか'
  a: '{trial}日間の無料体験版があります。体験後は {price} 円の買い切りで、Microsoft Store から入手できます。'

- q: '入力した文章が送信されたり、保存されたりしませんか'
  a: '本アプリはネットワーク通信を一切行わず、読み取った文章を本アプリのファイルに保存することもありません。ただし読み取りにクリップボードを使うため、Windows の「クリップボードの履歴」（Win+V）や「デバイス間で同期」を有効にしている場合は、その機能によって記録・同期されることがあります。詳しくは<a href="{base}/privacy.html">プライバシーポリシー</a>をご覧ください。'

- q: 'Microsoft Store に「すべてのシステム リソースを使用する」と表示されるのはなぜですか'
  a: '他のアプリで起動用のキーが押されたことを検知し、そのアプリへ日本語を入力し直すためです。キーボード全体を監視するフックと、他のアプリへのキー入力の送信を使うため、この表示になります。どのキーを押したかを記録したり、送信したりはしません。'

- q: 'インターネット接続や .NET は必要ですか'
  a: 'どちらも不要です。ネットワーク通信を一切行わず、必要なものはすべてアプリに含まれています。管理者権限も必要ありません。'

- q: 'Google 日本語入力でも動きますか'
  a: '動きます。Microsoft IME と Google 日本語入力の両方で動作を確認しています。'

- q: 'API や HTML のような英単語も変換されてしまいますか'
  a: '大文字はそのままの表記で残ります（1 文字でも残ります）。<code>api</code> のような小文字の英単語はローマ字と区別する方法がないため、かなとして読み直されます。残したい場合は大文字で入力するか、間に半角スペースを入れてください。'

- q: '長い文章もまとめて変換できますか'
  a: 'おすすめしません。一度に変換する文字数が多いと、IME が先頭のほうから変換を自動で確定していき、確定された部分は変換候補を選び直せません。目安はローマ字で 150 文字程度です。文や文節の区切りごとに変換してください。'

- q: 'Enter で改行した前の行も変換できますか'
  a: 'できません。変換されるのは、直前の改行からカーソルまでの範囲だけです。画面端での折り返しは影響しないため、Enter を押していなければ複数行に見えていてもまとめて変換されます。'
