<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.url == "/" %}{{ site.title }} — {{ site.tagline }}{% else %}{{ page.title }} | {{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<link rel="icon" href="{{ '/assets/img/icon.png' | relative_url }}" type="image/png">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:locale" content="ja_JP">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:title" content="{% if page.url == '/' %}{{ site.title }} — {{ site.tagline }}{% else %}{{ page.title }} | {{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image" content="{{ '/assets/img/icon.png' | absolute_url }}">
<meta name="twitter:card" content="summary">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "{{ site.title }}",
      "item": "{{ '/' | absolute_url }}"
    }{% if page.url != "/" %},
    {
      "@type": "ListItem",
      "position": 2,
      "name": "{{ page.title }}",
      "item": "{{ page.url | absolute_url }}"
    }{% endif %}
  ]
}
</script>
{% if page.url == "/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "{{ site.title }}",
  "description": "{{ site.description }}",
  "applicationCategory": "UtilitiesApplication",
  "operatingSystem": "Windows 10, Windows 11",
  "offers": {
    "@type": "Offer",
    "url": "https://apps.microsoft.com/detail/9ND04SG0293F",
    "price": "350",
    "priceCurrency": "JPY"
  }
}
</script>
{% endif %}
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/icon.png' | relative_url }}" alt="" width="32" height="32">
      <span class="brand-name">ro-maji IME Rescue</span>
    </a>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}">トップ</a>
      <a href="{{ '/troubleshooting.html' | relative_url }}">困ったとき</a>
      <a href="{{ '/privacy.html' | relative_url }}">プライバシー</a>
    </nav>
  </div>
</header>

<main>
{% if page.url != "/" %}
  <div class="wrap page-head">
    <h1>{{ page.title }}</h1>
  </div>
{% endif %}

<div class="wrap prose">
{{ content }}
</div>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <p class="footer-brand">ro-maji IME Rescue</p>
    <p class="footer-note">{{ site.tagline }}</p>
    <nav class="footer-nav">
      <a href="{{ '/' | relative_url }}">トップ</a>
      <a href="{{ '/troubleshooting.html' | relative_url }}">困ったとき</a>
      <a href="{{ '/privacy.html' | relative_url }}">プライバシーポリシー</a>
      <a href="mailto:moappsupport@gmail.com">お問い合わせ</a>
    </nav>
  </div>
</footer>

</body>
</html>
